[project]
name = "lwredis"
version = "0.1.0"
description = "파이썬으로 만드는 Redis 일부 클론"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]
